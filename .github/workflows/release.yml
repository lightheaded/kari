name: release

# A tag `vX.Y.Z` builds the macOS bundles and publishes a GitHub release.
# The tag must match the version in src-tauri/tauri.conf.json and in docs/screenshots/VERSION.
# The bundles are not signed or notarized. README.md tells users how to open them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Check that the screenshots were taken for this version
        # scripts/bump-version.sh runs `bun run screenshots`, which writes this stamp.
        # README.md and TOUR.md must show the release that the tag names.
        run: |
          stamp=$(cat docs/screenshots/VERSION)
          if [ "v$stamp" != "${{ github.ref_name }}" ]; then
            echo "docs/screenshots/VERSION is $stamp, tag is ${{ github.ref_name }}. Run scripts/bump-version.sh, which retakes the screenshots."
            exit 1
          fi
          for f in board board-dark plan drawer decision search new-task columns settings; do
            test -s "docs/screenshots/$f.png" || { echo "docs/screenshots/$f.png is missing"; exit 1; }
          done

      - name: Create a draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `kari ${context.ref.replace('refs/tags/', '')}`,
              body: [
                '## Install',
                '',
                'Download the `.dmg` for your Mac: `aarch64` for Apple silicon, `x64` for Intel.',
                'The app is not signed. After you copy it to Applications, run:',
                '',
                '```',
                'xattr -dr com.apple.quarantine /Applications/kari.app',
                '```',
                '',
                'A Linux host can run the headless node from `kari-node-<tag>-x86_64-unknown-linux-gnu.tar.gz`.',
                'Start it with `kari-node serve` and add it under Settings, Nodes in the app.',
                '',
                'An Android phone installs `kari-<tag>-android-arm64.apk`. It reaches the nodes over a private network,',
                'such as a VPN, and pairs with the code from Settings, Nodes on the desktop. See TOUR.md.',
                '',
                'See the README for requirements and setup.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  node-binary:
    # The headless node for a Linux host. The desktop app connects to it over
    # an SSH port forward. Attached to the release as a tarball.
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-node

      - name: Build the node
        run: cargo build --release -p kari-cli

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="kari-node-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          mkdir -p "$name"
          cp target/release/kari-node LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          gh release upload "${{ github.ref_name }}" "$name.tar.gz" --clobber

  android-apk:
    # The phone app, signed with the release key from the repository secrets.
    # Without the key the job builds and stops: an unsigned APK installs nowhere.
    # To make the key once: keytool -genkeypair -v -keystore kari-release.jks
    #   -alias kari -keyalg RSA -keysize 4096 -validity 10000
    # Then set ANDROID_KEYSTORE (base64 of the file), ANDROID_KEYSTORE_PASSWORD,
    # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets.
    needs: create-release
    runs-on: ubuntu-latest
    env:
      # A step cannot test a secret directly; this flag carries the answer.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 ndk;27.2.12479018

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-release

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          bun tauri android init
          bun tauri android build --apk --target aarch64
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk | head -1)
          echo "apk=$apk" >> "$GITHUB_ENV"

      - name: Sign and upload
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/34.0.0"
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          name="kari-${{ github.ref_name }}-android-arm64.apk"
          "$tools/zipalign" -p 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$name" aligned.apk
          "$tools/apksigner" verify "$name"
          rm -f release.jks
          gh release upload "${{ github.ref_name }}" "$name" --clobber

  publish-release:
    needs: [create-release, build, node-binary, android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
