name: release

# A tag `vX.Y.Z` builds the macOS bundles and publishes a GitHub release.
# The tag must match the version in src-tauri/tauri.conf.json and in docs/screenshots/VERSION.
# The bundles are not signed or notarized. README.md tells users how to open them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      # The whole history and every tag. The release notes are built from the
      # commits since the previous release tag, and the default shallow clone
      # has neither the commits nor the tag to measure from.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Check that the screenshots were taken for this version
        # scripts/bump-version.sh runs `bun run screenshots`, which writes this stamp.
        # README.md and TOUR.md must show the release that the tag names.
        run: |
          stamp=$(cat docs/screenshots/VERSION)
          if [ "v$stamp" != "${{ github.ref_name }}" ]; then
            echo "docs/screenshots/VERSION is $stamp, tag is ${{ github.ref_name }}. Run scripts/bump-version.sh, which retakes the screenshots."
            exit 1
          fi
          for f in board board-dark plan drawer decision schedule search new-task columns settings; do
            test -s "docs/screenshots/$f.png" || { echo "docs/screenshots/$f.png is missing"; exit 1; }
          done

      # The commit message is the release note. Subjects since the previous tag
      # become the TL;DR, bodies become "What changed". A release whose notes are
      # the install text and nothing else tells a reader nothing about why they
      # want the update, which is the failure this replaced.
      - name: Write the release notes
        run: |
          scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md
          echo "release notes: $(wc -c < release-notes.md) bytes"

      # Every commit body goes onto a public page. This is a net, not a proof: it
      # catches a home path, an address or an internal host name, and it cannot
      # catch a machine called by a name only its owner knows. The control that
      # works is not writing it into the commit in the first place.
      - name: Refuse notes that point at one machine or one person
        run: scripts/check-privacy.sh release-notes.md

      - name: Create a draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `kari ${context.ref.replace('refs/tags/', '')}`,
              // Written to a file rather than inlined here. The notes run to
              // tens of kilobytes of prose that no YAML string should hold.
              body: require('fs').readFileSync('release-notes.md', 'utf8'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # One at a time, on purpose. Each job writes `latest.json` by reading the
      # copy already on the release, adding its own platform and putting it
      # back. Two jobs that read before either writes both publish a file with
      # one platform in it, and the updater then answers "no update" for the
      # other Mac. Serial costs a few minutes and cannot lose a platform.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      # The signing key is what lets a running kari trust an update. Its public
      # half is in tauri.conf.json; the private half and its password are
      # repository secrets, like the Android keystore above, and the key itself
      # lives outside this repository.
      - name: Refuse to run without a signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Without the key tauri-action builds bundles and no signature, and
          # then publishes a release that no installed kari can update to.
          # Better to fail here than to ship a release that quietly ends the
          # update chain for everyone already running kari.
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is a required repository secret."
            exit 1
          fi

      - name: Build and upload the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  windows-desktop:
    # The desktop app for Windows, as an NSIS installer. It runs after `build`
    # rather than beside it, and for the same reason that matrix is serial:
    # tauri-action writes `latest.json` by reading the copy already on the
    # release, adding its own platform and putting it back. In parallel with a
    # macOS job, one of the two platforms is lost and the updater then answers
    # "no update" for it.
    needs: [create-release, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-windows-desktop

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      - name: Refuse to run without a signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Same reason as the macOS job: without the key this publishes a
          # release that no installed kari can update to.
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is a required repository secret."
            exit 1
          fi

      - name: Build and upload the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # NSIS only. It installs per user, which suits a tray app that reads
          # one user's Claude Code state, and `installMode: passive` in
          # tauri.conf.json is an NSIS setting: an MSI would ignore it and the
          # updater would put a dialog in front of an unattended restart.
          args: --target x86_64-pc-windows-msvc --bundles nsis

  node-binary:
    # The headless node for a Linux host. The desktop app connects to it over
    # an SSH port forward. Attached to the release as a tarball.
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-node

      - name: Build the node
        run: cargo build --release -p kari-cli

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="kari-node-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          # The bare binary is published under exactly "$name", because that is
          # the asset `kari-node update` asks for. So the tarball is staged in a
          # directory that is NOT "$name" — using one name for both made `cp`
          # put the binary inside the directory and `sha256sum` read a
          # directory. The Windows job never hit this: its binary ends in .exe,
          # so the two names differ there by accident rather than by design.
          mkdir -p "$name.dir/$name"
          cp target/release/kari-node LICENSE README.md "$name.dir/$name/"
          tar czf "$name.tar.gz" -C "$name.dir" "$name"
          # The bare binary as well, for `kari-node update`. A node is one file,
          # so it replaces itself with one file: no tar reader in the node, and
          # nothing to get wrong about paths inside an archive. The tarball
          # stays, because a person downloading a node wants the README with it.
          cp target/release/kari-node "$name"
          sha256sum "$name" > "$name.sha256"
          gh release upload "${{ github.ref_name }}" \
            "$name.tar.gz" "$name" "$name.sha256" --clobber

  macos-node-binary:
    # The headless node for a Mac. A Mac runs the desktop app, and it also runs
    # a node: the app holds the engine while its window is open, and the node
    # holds it the rest of the time. Both architectures, because the app ships
    # for both and a node has to match the host it watches.
    needs: create-release
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-macos-node-${{ matrix.target }}

      - name: Build the node
        run: cargo build --release -p kari-cli --target ${{ matrix.target }}

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="kari-node-${{ github.ref_name }}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/kari-node"
          # Staged in a directory that is NOT "$name": the bare binary is
          # published under exactly that name, because it is the asset the
          # node's own updater asks for. See the Linux job.
          mkdir -p "$name.dir/$name"
          cp "$bin" LICENSE README.md "$name.dir/$name/"
          tar czf "$name.tar.gz" -C "$name.dir" "$name"
          cp "$bin" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          gh release upload "${{ github.ref_name }}" \
            "$name.tar.gz" "$name" "$name.sha256" --clobber

  windows-node-binary:
    # The same headless node for a Windows host. A zip rather than a tarball,
    # because Windows opens one without a tool.
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-windows-node

      - name: Build the node
        run: cargo build --release -p kari-cli

      - name: Pack and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="kari-node-${{ github.ref_name }}-x86_64-pc-windows-msvc"
          mkdir -p "$name"
          cp target/release/kari-node.exe LICENSE README.md "$name/"
          7z a "$name.zip" "$name"
          # The bare .exe as well, for `kari-node update`. See the Linux job.
          cp target/release/kari-node.exe "$name.exe"
          sha256sum "$name.exe" > "$name.exe.sha256"
          gh release upload "${{ github.ref_name }}" \
            "$name.zip" "$name.exe" "$name.exe.sha256" --clobber

  android-apk:
    # The phone app, signed with the release key from the repository secrets:
    # KARI_KEYSTORE_BASE64 (the .jks, base64) and KARI_KEYSTORE_PASSWORD (one
    # password for the store and the key, alias `kari`). The key lives outside
    # this repository. Obtainium installs the APK, so the asset name never
    # carries the version and the key never changes.
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to run without a keystore
        env:
          KEYSTORE_B64: ${{ secrets.KARI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KARI_KEYSTORE_PASSWORD }}
        run: |
          # A silent skip is a green run that ships no phone app. The release
          # stops here instead.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KARI_KEYSTORE_BASE64 and KARI_KEYSTORE_PASSWORD are required repository secrets."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 ndk;27.2.12479018

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-release

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          bun tauri android init
          scripts/android-icons.sh
          bun tauri android build --apk --target aarch64
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk | head -1)
          test -n "$apk"
          echo "apk=$apk" >> "$GITHUB_ENV"

      - name: Sign and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.KARI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KARI_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -p -f 4 "$apk" aligned.apk
          # The name never carries the version, so
          # /releases/latest/download/kari-latest.apk is a permanent link.
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias kari --key-pass env:KEYSTORE_PASSWORD --out kari-latest.apk aligned.apk
          "$tools/apksigner" verify kari-latest.apk
          rm -f "$RUNNER_TEMP/release.jks"
          sha256sum kari-latest.apk > kari-latest.apk.sha256
          gh release upload "${{ github.ref_name }}" kari-latest.apk kari-latest.apk.sha256 --clobber

  publish-release:
    # Every builder, so the release is never published half-uploaded. An
    # updater that reads `latest.json` from the newest published release must
    # not see one whose assets are still arriving.
    needs:
      [
        create-release,
        build,
        windows-desktop,
        node-binary,
        macos-node-binary,
        windows-node-binary,
        android-apk,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
