name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A macOS runner, because the app uses the tray, notifications and osascript.
    # A Linux build would compile a different dependency set and prove less.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint the frontend
        run: bun run lint

      - name: Build the frontend
        run: bun run build

      - name: Check the Rust formatting
        run: cargo fmt --all --check

      - name: Lint the Rust code
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the Rust tests
        run: cargo test --workspace

      - name: Check for private detail in the tracked files
        run: scripts/check-privacy.sh

  node:
    # The headless node runs on Linux, where the app itself never builds.
    # This job proves the core and the node compile without the macOS code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: linux-node

      - name: Lint the node
        run: cargo clippy -p kari-core -p kari-cli --all-targets -- -D warnings

      - name: Run the node tests
        run: cargo test -p kari-core -p kari-cli

      - name: Check that the node starts and answers
        run: |
          cargo build -p kari-cli
          ./target/debug/kari-node identity | tee identity.json
          jq -e '.api_version == 1 and .app == "kari"' identity.json

  android:
    # The phone app. The generated Android project is not tracked, so the job
    # creates it, then builds a debug APK for arm64 to prove the shell and the
    # core compile for Android.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 ndk;27.2.12479018

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android

      - name: Install the frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build a debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          bun tauri android init
          scripts/android-icons.sh
          bun tauri android build --debug --apk --target aarch64
          ls -la src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk

  secrets:
    # gitleaks scans the whole history for credentials. A key that lands in
    # one commit stays readable in every clone, so the scan is not optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
