[package]
name = "kari-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless kari node: serves the board over HTTP for the kari desktop app"

[[bin]]
name = "kari-node"
path = "src/main.rs"

[[bin]]
name = "kari-server"
path = "src/server_main.rs"

[dependencies]
kari-core = { path = "../kari-core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest.workspace = true
# `kari-node update` replaces this binary from a GitHub release. semver so that
# 0.10.0 sorts after 0.9.0, which a string compare gets wrong; sha2 to check the
# download against the checksum published beside it.
semver = "1"
sha2 = "0.10"
