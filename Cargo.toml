[workspace]
resolver = "2"
members = ["crates/kari-core", "crates/kari-cli", "src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
# The node dials its server, and a server behind a reverse proxy speaks TLS.
# Without a TLS feature `connect_async` fails on a wss:// URL with an error
# that says nothing about the cause. webpki roots rather than the platform
# store: the node runs on macOS, Windows and Linux and must not need three.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Pulled in only to choose rustls' crypto provider. rustls 0.23 refuses to pick
# one for you and panics at the first TLS handshake unless exactly one provider
# feature is enabled on the rustls crate itself — which feature unification does
# not guarantee, so kari installs it explicitly. See link::ensure_crypto_provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
