[package]
name = "kari"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kanban board for Claude Code sessions with quota-aware scheduling"
rust-version = "1.77.2"

[lib]
name = "kari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kari-core = { path = "../crates/kari-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
axum.workspace = true

# The updater replaces the bundle it runs from, so it exists on the desktop
# only. The phone installs the APK through Obtainium, which watches the same
# release and needs nothing in the app.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
